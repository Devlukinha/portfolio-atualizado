<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página em manutenção</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 800px;

        }

        .foto {
            max-width: 300px;
            width: 100%;
            height: auto;
            display: block;
        }

        div {
            width: 800px;
            text-align: center;
        }

        @media (max-width: 600px) {

            .foto {
                max-width: 250px;
            }

            div {
                width: 300px;
            }
        }

    </style>
</head>
<body>
    <main>
        <img src="./assets/404 Error with a cute animal-bro.svg" alt="image 404 error" class="foto">

        <div>
            <h1>PÁGINA INDISPONÍVEL</h1>
            <p>No momento o portfólio está passando por atualizações e otimizações, em breve estará no ar novamente!</p>
        </div>
    </main>
</body>
</html>
