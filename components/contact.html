<section

          VAMOS TROCAR UMA IDEIA?

        >
          Fique à vontade para entrar em

        </p>

        <form
          action="https://formsubmit.co/lucashenrique030407@gmail.com"
          method="POST"
          id="formulario"
          class="flex w-[340px] flex-col justify-center p-2 gap-3 xl:min-w-[550px]"
        >
          <label
            for="nome"
            class="label-1 invisible text-start text-xl font-semibold text-white"
            >NOME:</label
          >
          <input
            type="text"
            name="nome"
            placeholder="Digite seu nome aqui"
            required
            id="nome"
            class="text-dark-blue border-none input-1 h-12 rounded-md border-2 bg-blue-500 text-center text-xl font-medium focus:border-white focus:outline-none md:h-12 xl:h-14 xl:w-full invisible"
          />

          <label
            for="email"
            class="label-2  text-start text-xl font-semibold text-white invisible"
            >EMAIL:</label
          >
          <input
            type="email"
            name="email"
            placeholder="Digite seu email aqui"
            required
            id="email"
            class="text-dark-blue border-none input-2  h-12 rounded-md border-2 bg-blue-500 text-center text-xl font-medium focus:border-white focus:outline-none md:h-12 xl:h-14 xl:w-full invisible"
          />

          <label for="assunto" class="label-3  text-xl font-semibold text-white"
            >ASSUNTO:</label
          >
          <textarea
            name="mensagem"
            id="assunto"
            class="text-dark-blue border-none input-3  h-48 resize-none rounded-md border-2 bg-blue-500 p-2 text-center text-xl font-medium focus:border-white focus:outline-none md:h-52 xl:h-52 xl:w-full invisible"
            required
            placeholder="Deixe aqui sua mensagem"
          ></textarea>

          <input type="hidden" name="_captcha" value="false" />
          <input
            type="hidden"
            name="_next"
            value="https://devlukinha.github.io/mess/"
          />
          <input
            type="hidden"
            name="_subject"
            value="Mensagem vinda do seu Portfólio"
          />

          <button
            id="btnEnviarMsg"
            class="btn-enviar  h-12 w-32 cursor-pointer rounded-md bg-green-600 text-xl font-semibold duration-300 hover:scale-90 hover:bg-green-800 md:h-10 xl:h-10 xl:w-full self-center"
            type="submit"
          >
            Enviar
          </button>
        </form>
